[project]
name = "crash-test"
version = "0.1.0"
description = "Crash-Test : casser les hypothèses d'un théorème, mesurer ce qui cède, puis réparer."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "asteval>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "statsmodels>=0.14",
    "hypothesis>=6.120",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
