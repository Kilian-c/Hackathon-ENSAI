# yaml-language-server: $schema=./schema.json
schema_version: 1
id: "convergence-dominee"
title: "Convergence dominée : peut-on échanger limite et intégrale ?"
discipline: "intégration"
level: "2"                      # 1 Découverte, 2 Intermédiaire, 3 Avancé
concepts: ["intégrale de Lebesgue", "convergence dominée", "domination", "convergence presque partout"]

theorem:
  name: "Théorème de convergence dominée"
  statement: |
    Soit $(f_n)$ une suite de fonctions mesurables qui converge presque partout vers une fonction $f$, et
    telle qu'il existe $g \in L^1$ positive avec $|f_n| \le g$ presque partout, pour tout $n$. Alors $f$ et
    les $f_n$ sont intégrables, et
    $$\lim_{n \to \infty} \int f_n \, d\mu = \int f \, d\mu \qquad \text{et} \qquad \lim_{n \to \infty} \int |f_n - f| \, d\mu = 0.$$
    Ici, les intégrales sont calculées sur $[0, 10]$ et la limite simple des trois suites proposées est la
    fonction nulle : le théorème annonce donc que les intégrales tendent vers $0$.

equation:
  tex: '\lim_{n \to \infty} \int f_n \, d\mu = {{limite}}'
  terms:
    limite:
      ok: '\int \lim_{n \to \infty} f_n \, d\mu'
      corrected: '\lim_{n \to \infty} \int_{[\delta,\,10]} f_n \, d\mu'

params:
  k: { type: number, label: "Rang n de la suite", min: 1, max: 100, step: 1, default: 100,
       sweep_values: [1, 3, 10, 30, 100] }

hypotheses:
  domination:
    type: choice
    healthy_value: "sinus"
    label: "Domination par une fonction intégrable"
    category: "domination"
    options:
      sinus:     { label: "Exemple du cours : sin(x)ⁿ / (x(1 + x))",
                   expr: "(sin(x) ** p.k) / (x * (1 + x))" }
      puissance: { label: "xⁿ sur [0, 1]", expr: "(x < 1) * (x ** p.k)" }
      # largeur 1/n arrondie à un nombre entier de cellules de la grille (0,002) : l'intégrale vaut exactement 1
      bosse:     { label: "n·1[0, 1/n] (aucune domination)",
                   expr: "(x < floor(500 / p.k + 0.5) * 0.002) / (floor(500 / p.k + 0.5) * 0.002)" }
    statement_tex: '\exists\, g \in L^1,\ g \ge 0,\ |f_n| \le g \ \text{p.p.}'
    why: "La domination empêche la masse de $f_n$ de se concentrer ou de s'échapper : elle permet de passer à la limite dans l'intégrale par le lemme de Fatou, appliqué à $2g - |f_n - f|$."
    when_broken: "Sans fonction dominante intégrable, la suite peut converger simplement vers $0$ tout en gardant une intégrale égale à $1$ : la masse se concentre près de $0$ et disparaît de la limite."
    affects: [limite]

counterexamples:
  - id: "bosse-glissante"
    label: "La bosse qui se concentre"
    explain: "Chaque $f_n$ vaut $n$ sur $[0, 1/n]$ : son intégrale vaut toujours $1$, alors que la suite tend vers $0$ en tout point $x > 0$. Aucune fonction intégrable ne domine toutes les bosses."
    state: { params: { k: 100 }, hypotheses: { domination: "bosse" } }
  - id: "bosse-moderee"
    label: "La même bosse, pour n = 10"
    explain: "Même pour un rang modéré, l'intégrale reste égale à $1$ : il n'y a rien à attendre de $n$ plus grand."
    state: { params: { k: 10 }, hypotheses: { domination: "bosse" } }

generator:
  type: random
  n: 5000
  repeat: 1                      # calcul déterministe : une seule « répétition »
  variables:
    x: { expr: "10 * (idx + 0.5) / 5000" }     # milieux de cellules sur [0, 10]
    f: { expr: "@h.domination" }

methods:
  - id: integrale
    role: method
    call: quadrature
    label: "Intégrale de fₙ sur [0, 10]"
    args: { x: x, f: f, a: 0, b: 10, kind: "rectangles", truth: 0 }
  - id: hors_zero
    role: correction
    call: quadrature
    label: "Intégrale sur [δ, 10], sans le voisinage de 0"
    explain: "On écarte un voisinage de $0$, là où la domination échoue : sur $[\\delta, 10]$ les bosses finissent par disparaître (elles sont nulles dès que $n > 1/\\delta$) et l'intégrale tend bien vers $0$. Ce n'est plus le théorème de convergence dominée, mais une convergence uniforme loin de $0$."
    repairs: [domination]
    args: { x: x, f: "f * (x > 0.5)", a: 0, b: 10, kind: "rectangles", truth: 0 }

measures:
  ecart:
    agg: "mean(reps.error)"
    label: "Intégrale de fₙ moins intégrale de la limite"
    decimals: 3
    primary: true
    target: 0
    direction: both
    ok_within: 0.15
    broken_beyond: 0.5
    texts:
      ok: "Les deux nombres coïncident presque : l'écart est de {value}."
      warning: "L'échange limite-intégrale commence à échouer : écart de {value}."
      broken: "On ne peut pas échanger : l'intégrale de fₙ est à {value} de celle de la limite (qui vaut 0)."

challenges:
  - id: "convergence-ps-suffit"
    goal: "Obtenez un verdict Fiable avec une suite qui ne converge pas uniformément (l'exemple du cours)."
    when: "h.domination == 'sinus' and p.k >= 30 and s.ecart == 'ok'"
    unlock: "La convergence presque partout suffit, à condition qu'une fonction intégrable domine toute la suite : la convergence uniforme n'est pas nécessaire."
  - id: "masse-qui-reste"
    goal: "Rendez la méthode principale Rompue alors que la correction reste Fiable."
    when: "s.ecart == 'broken' and s.ecart.hors_zero == 'ok'"
    unlock: "Tant que la domination échoue seulement près de $0$, il suffit d'en écarter un voisinage pour retrouver la convergence."

auto_sweep: [p.k]

views:
  - id: courbe
    type: curves
    title: "La fonction fₙ, et l'aire qu'elle délimite"
    ui: { x_title: "x", y_title: "fₙ(x)", fill_area: true }
    bind: { t: example.x, series: [ { y: example.f, label: "fₙ" } ] }
  - id: suite
    type: sensitivity
    title: "Selon le rang n"
    sweep: { axes: [p.k] }
  - id: famille
    type: sensitivity
    title: "Selon la suite de fonctions"
    sweep: { axes: [h.domination] }
  - id: validite
    type: validity_domain
    title: "Domaine de validité"
    sweep: { axes: [h.domination, p.k] }

questions:
  - id: "cd-q1-simple"
    type: misconception
    prompt: "Une suite de fonctions converge vers $0$ en tout point $x > 0$, et chaque $f_n$ a une intégrale égale à $1$. A-t-on alors $\\lim \\int f_n = \\int \\lim f_n = 0$ ?"
    hypothesis: "domination"
    choices:
      - id: "a"
        label: "Oui : la convergence simple suffit à échanger limite et intégrale."
        correct: false
        reveal_state: { params: { k: 100 }, hypotheses: { domination: "bosse" } }
        verify: "s.ecart == 'broken' and s.ecart.hors_zero == 'ok'"
        focus_view: "courbe"
        explain: "Non : la convergence simple ne contrôle pas la masse. Ici elle se concentre près de $0$ et disparaît de la limite, qui vaut $0$, alors que chaque intégrale vaut $1$."
      - id: "b"
        label: "Non : il faut une fonction dominante intégrable."
        correct: true
        reveal_state: { params: { k: 100 }, hypotheses: { domination: "bosse" } }
        verify: "s.ecart == 'broken' and s.ecart.hors_zero == 'ok'"
        focus_view: "courbe"
        explain: "Exact : la domination $|f_n| \\le g$ avec $g \\in L^1$ est l'hypothèse qui manque ici. Aucune fonction intégrable ne domine toutes les bosses."

  - id: "cd-q2-uniforme"
    type: misconception
    prompt: "La suite $f_n(x) = \\sin(x)^n / (x(1+x))$ ne converge pas uniformément sur $[0, 10]$ : elle vaut $\\pm 1/(x(1+x))$ aux points $\\pi/2 + k\\pi$. Peut-on quand même passer à la limite sous l'intégrale ?"
    hypothesis: "domination"
    choices:
      - id: "a"
        label: "Non : sans convergence uniforme, l'échange est impossible."
        correct: false
        reveal_state: { params: { k: 100 }, hypotheses: { domination: "sinus" } }
        verify: "s.ecart == 'ok'"
        focus_view: "courbe"
        explain: "La convergence uniforme n'est pas requise. Les points où le sinus vaut $\\pm 1$ forment un ensemble négligeable : la suite converge presque partout, et elle est dominée par $1/(x(1+x))$."
      - id: "b"
        label: "Oui : la convergence presque partout et la domination suffisent."
        correct: true
        reveal_state: { params: { k: 100 }, hypotheses: { domination: "sinus" } }
        verify: "s.ecart == 'ok'"
        focus_view: "courbe"
        explain: "Exact : le théorème de convergence dominée ne demande ni convergence uniforme, ni convergence partout. Les intégrales tendent bien vers $0$."

  - id: "cd-q3-prediction"
    type: prediction
    prompt: "Avec la suite des bosses $n \\cdot 1_{[0, 1/n]}$, si le rang passe de {k} à quatre fois plus, que devient l'intégrale de $f_n$ ?"
    procedural_params:
      k: { min: 10, max: 25, step: 5 }
    state: { hypotheses: { domination: "bosse" } }
    sweep: { target: p.k, from: "{k}", to: "{k} * 4" }
    measure: ecart
