# yaml-language-server: $schema=./schema.json
schema_version: 1
id: "fubini-tonelli"
title: "Fubini-Tonelli : intervertir deux intégrales"
discipline: "intégration"
level: "3"                      # 1 Découverte, 2 Intermédiaire, 3 Avancé
concepts: ["intégrale de Lebesgue", "théorème de Fubini", "théorème de Tonelli", "intégrale itérée", "mesure produit"]

theorem:
  name: "Théorèmes de Fubini-Tonelli et de Fubini-Lebesgue"
  statement: |
    Soit $f$ mesurable sur $X \times Y$, les mesures $\mu$ et $\nu$ étant $\sigma$-finies. Si $f \ge 0$ (Tonelli) ou si
    $f$ est intégrable pour $\mu \otimes \nu$ (Fubini), alors
    $$\int_{X \times Y} f \, d(\mu \otimes \nu) = \int_X \left( \int_Y f \, d\nu \right) d\mu = \int_Y \left( \int_X f \, d\mu \right) d\nu.$$
    Sans l'une de ces hypothèses, les deux intégrales itérées peuvent exister et différer. Ici $X = Y = [0, 1]$ :
    l'expérience calcule les deux intégrales itérées et trace les intégrales intérieures : leurs aires sont les
    deux valeurs. Elles coïncident quand le théorème s'applique.

equation:
  tex: '\int_X \left( \int_Y f \, d\nu \right) d\mu = {{membre}}'
  terms:
    membre:
      ok: '\int_{X \times Y} f \, d(\mu \otimes \nu)'

params:
  eps: { type: number, label: "Troncature ε : on intègre sur [ε, 1]² (0 : le carré entier ; sous 0,03 la grille ne résout plus le coin)",
         min: 0, max: 0.5, step: 0.01, default: 0, sweep_values: [0, 0.03, 0.1, 0.3] }

hypotheses:
  integrabilite:
    type: choice
    healthy_value: "integrable"
    label: "Intégrabilité sur le produit"
    category: "intégrabilité"
    options:
      integrable: { label: "y(1 + sin 3x) : intégrable sur le carré",
                    expr: "y * (1 + sin(3 * x))" }
      diverge:    { label: "(x² − y²) / (x² + y²)² : non intégrable en (0, 0)",
                    expr: "(x ** 2 - y ** 2) / (x ** 2 + y ** 2) ** 2" }
    statement_tex: '\int_{X \times Y} |f| \, d(\mu \otimes \nu) < +\infty'
    why: "L'intégrabilité sur le produit garantit que la masse de $|f|$ est finie : on peut alors découper l'intégrale double en tranches dans n'importe quel ordre, sans que des contributions infinies de signes opposés se compensent différemment selon l'ordre."
    when_broken: "Sans intégrabilité, les deux intégrales itérées existent mais ne sont plus égales : pour $(x^2 - y^2)/(x^2 + y^2)^2$ sur le carré unité, on trouve $\\pi/4$ en intégrant d'abord en $y$ et $-\\pi/4$ en intégrant d'abord en $x$."
    affects: [membre]
  sigma_finie:
    type: boolean
    healthy_value: true
    label: "Mesures σ-finies"
    category: "mesure"
    ok_label: "σ-finies"
    broken_label: "Non σ-finies"
    robust_expected: true
    disabled_when: "True"
    disabled_text: "Toujours vraie ici : la mesure de Lebesgue sur $[0, 1]$ est finie, donc $\\sigma$-finie. Le contre-exemple classique utilise la mesure de comptage, qui ne l'est pas sur $[0, 1]$, et ne se simule pas sur une grille."
    statement_tex: '\mu, \nu \ \sigma\text{-finies}'
    why: "La $\\sigma$-finitude permet de construire la mesure produit de façon unique et de découper l'espace en morceaux de mesure finie."
    when_broken: "Avec la mesure de Lebesgue et la mesure de comptage sur $[0, 1]$, la diagonale donne des intégrales itérées égales à $0$ et à $1$."
    affects: []
  mesurabilite:
    type: boolean
    healthy_value: true
    label: "Fonction mesurable"
    category: "mesurabilité"
    ok_label: "Mesurable"
    broken_label: "Non mesurable"
    robust_expected: true
    disabled_when: "True"
    disabled_text: "Toujours vraie ici : une fonction non mesurable ne se construit pas numériquement ($f$ doit être mesurable pour la tribu produit)."
    statement_tex: 'f \ \text{mesurable pour} \ \mathcal{X} \otimes \mathcal{Y}'
    why: "Sans mesurabilité pour la tribu produit, l'intégrale double n'est pas définie, et les fonctions « coupes » ne sont pas mesurables."
    when_broken: "L'énoncé tombe avant tout calcul : même la mesurabilité des intégrales intérieures n'est plus garantie."
    affects: []

counterexamples:
  - id: "deux-ordres"
    label: "Intégrer dans un ordre, puis dans l'autre"
    explain: "Pour $f(x, y) = (x^2 - y^2)/(x^2 + y^2)^2$, l'intégrale intérieure en $y$ vaut $1/(1 + x^2)$, positive, d'aire $\\pi/4$ ; l'intégrale intérieure en $x$ vaut $-1/(1 + y^2)$, négative, d'aire $-\\pi/4$. Les deux intégrales itérées existent et sont opposées."
    state: { hypotheses: { integrabilite: "diverge" } }

generator:
  type: random
  n: 4900                         # deux grilles de 2450 points : 25 x 98 (intégrale en y précise), 98 x 25 (en x)
  repeat: 1                       # calcul déterministe : une seule « répétition »
  variables:
    x: { expr: "p.eps + (1 - p.eps) * where(idx < 2450, ((idx // 98) + 0.5) / 25, (((idx - 2450) // 25) + 0.5) / 98)" }
    y: { expr: "p.eps + (1 - p.eps) * where(idx < 2450, ((idx % 98) + 0.5) / 98, (((idx - 2450) % 25) + 0.5) / 25)" }
    f: { expr: "@h.integrabilite" }

methods:
  - id: integrale
    role: method
    call: iterated_integrals
    label: "Intégrales itérées sur [0, 1]²"
    args: { x: x, y: y, f: f }

measures:
  ecart:
    agg: "mean(reps.gap)"
    label: "Écart entre les deux intégrales itérées"
    decimals: 3
    primary: true
    target: 0
    direction: both
    ok_within: 0.1
    broken_beyond: 0.3
    texts:
      ok: "Les deux intégrales itérées sont à {value} l'une de l'autre."
      warning: "Les deux intégrales itérées diffèrent de {value}."
      broken: "Les deux intégrales itérées diffèrent de {value} : l'ordre d'intégration compte."
  abs_int:
    agg: "mean(reps.abs_int)"
    label: "Intégrale de |f| sur [ε, 1]²"
    decimals: 2
  dy_dx:
    agg: "mean(reps.dy_dx)"
    label: "Intégrale d'abord en y, puis en x"
    decimals: 3
  dx_dy:
    agg: "mean(reps.dx_dy)"
    label: "Intégrale d'abord en x, puis en y"
    decimals: 3

challenges:
  - id: "deux-valeurs"
    goal: "Faites échouer l'échange des intégrales en rendant la fonction non intégrable."
    when: "h.integrabilite == 'diverge' and s.ecart == 'broken'"
    unlock: "Sans intégrabilité, l'ordre d'intégration décide du résultat : $\\pi/4$ dans un sens, $-\\pi/4$ dans l'autre."

views:
  - id: integrales
    type: curves
    title: "Les deux intégrales intérieures : leurs aires sont les deux intégrales itérées"
    ui:
      x_title: "x (pour ∫ f dy) ou y (pour ∫ f dx)"
      y_title: "intégrale intérieure"
      fill_area: true
      labels: { h1: "∫ f dx, en fonction de y" }
    bind: { t: curves.t, series: [ { y: curves.dy, label: "∫ f dy, en fonction de x" } ], h1: curves.dx }
  - id: famille
    type: sensitivity
    title: "Selon la fonction intégrée"
    sweep: { axes: [h.integrabilite] }

questions:
  - id: "ft-q1-echange"
    type: misconception
    prompt: "Les deux intégrales itérées de $f(x, y) = (x^2 - y^2)/(x^2 + y^2)^2$ sur $[0, 1]^2$ existent. Sont-elles forcément égales ?"
    hypothesis: "integrabilite"
    choices:
      - id: "a"
        label: "Oui : on peut toujours échanger l'ordre de deux intégrales."
        correct: false
        reveal_state: { hypotheses: { integrabilite: "diverge" } }
        verify: "s.ecart == 'broken'"
        focus_view: "integrales"
        explain: "Non : l'échange demande Tonelli (fonction positive) ou Fubini (fonction intégrable sur le produit). Ici la fonction change de signe et n'est pas intégrable : les deux intégrales intérieures ont des aires opposées, $\\pi/4$ et $-\\pi/4$."
      - id: "b"
        label: "Non : il faut que la fonction soit positive ou intégrable sur le produit."
        correct: true
        reveal_state: { hypotheses: { integrabilite: "diverge" } }
        verify: "s.ecart == 'broken'"
        focus_view: "integrales"
        explain: "Exact : sans positivité ni intégrabilité, l'ordre d'intégration peut changer le résultat."

  - id: "ft-q2-fonction-integrable"
    type: misconception
    prompt: "On prend $f(x, y) = y(1 + \\sin 3x)$, intégrable sur $[0, 1]^2$. Intégrer d'abord en $x$ ou d'abord en $y$ change-t-il la valeur de l'intégrale ?"
    hypothesis: "integrabilite"
    choices:
      - id: "a"
        label: "Oui : l'ordre d'intégration peut toujours changer le résultat."
        correct: false
        reveal_state: { hypotheses: { integrabilite: "integrable" } }
        verify: "s.ecart == 'ok'"
        focus_view: "integrales"
        explain: "Non : quand $f$ est intégrable sur le produit, Fubini garantit l'égalité des deux intégrales itérées. Les deux aires coïncident sur la courbe."
      - id: "b"
        label: "Non : l'intégrabilité sur le produit garantit la même valeur dans les deux ordres."
        correct: true
        reveal_state: { hypotheses: { integrabilite: "integrable" } }
        verify: "s.ecart == 'ok'"
        focus_view: "integrales"
        explain: "Exact : c'est le théorème de Fubini. Les deux aires sont égales."

  - id: "ft-q3-deux-valeurs"
    type: misconception
    prompt: "On trouve $\\pi/4$ en intégrant d'abord en $y$ et $-\\pi/4$ en intégrant d'abord en $x$. Qu'en conclure ?"
    hypothesis: "integrabilite"
    choices:
      - id: "a"
        label: "Une erreur de calcul s'est glissée quelque part."
        correct: false
        reveal_state: { hypotheses: { integrabilite: "diverge" } }
        verify: "s.ecart == 'broken'"
        focus_view: "integrales"
        explain: "Non : les deux calculs sont corrects. Chaque intégrale intérieure est bien définie, mais $f$ n'est pas intégrable sur le carré, donc l'échange est interdit."
      - id: "b"
        label: "$f$ n'est pas intégrable sur le carré : le théorème de Fubini ne s'applique pas."
        correct: true
        reveal_state: { hypotheses: { integrabilite: "diverge" } }
        verify: "s.ecart == 'broken'"
        focus_view: "integrales"
        explain: "Exact : deux intégrales itérées différentes sont le signe que l'hypothèse d'intégrabilité est violée."

  - id: "ft-q4-prediction"
    type: prediction
    prompt: "Avec $f(x, y) = (x^2 - y^2)/(x^2 + y^2)^2$, on intègre $|f|$ sur $[\\varepsilon, 1]^2$. Que devient cette intégrale quand $\\varepsilon$ passe de $0{,}3$ à $0{,}03$ ?"
    state: { hypotheses: { integrabilite: "diverge" } }
    sweep: { target: p.eps, from: 0.3, to: 0.03 }
    measure: abs_int
