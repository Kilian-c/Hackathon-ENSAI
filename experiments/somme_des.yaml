schema_version: 1
id: "somme-de-des"
title: "Somme de dés : quand la cloche apparaît-elle ?"
discipline: "probabilités"
level: "1"                      # 1 Découverte, 2 Intermédiaire, 3 Avancé (catalogue)
concepts: ["somme de variables", "convolution", "théorème central limite", "indépendance"]

theorem:
  name: "Somme de dés et théorème central limite"
  statement: |
    On lance k dés indépendants et on additionne les faces. Avec un seul dé, toutes les sommes
    sont également probables : l'histogramme est plat. Avec deux dés, il forme un triangle. Dès
    quelques dés, il prend la forme d'une cloche, celle de la loi normale de moyenne 3,5 k et de
    variance 35 k / 12. Il faut que les dés soient indépendants ; ils n'ont pas besoin d'être équilibrés.

equation:
  tex: '{{somme}} \;\approx\; \mathcal{N}\!\left(3{,}5\,k,\ \tfrac{35}{12}\,k\right)'
  terms:
    somme:
      ok: 'S_k = X_1 + X_2 + \cdots + X_k'

params:
  k: { type: number, label: "Nombre de dés k", min: 1, max: 30, step: 1, default: 10,
       sweep_values: [1, 2, 3, 5, 10, 20, 30] }

hypotheses:
  dependance:
    type: continuous
    range: [0, 0.95]
    step: 0.05
    healthy_value: 0.0
    label: "Dés lancés indépendamment"
    category: "independance"
    ok_label: "Indépendants"
    broken_label: "Liés (chaque dé copie en partie son voisin)"
    statement_tex: 'X_1, \ldots, X_k \ \text{indépendants}'
    why: "Des dés indépendants se compensent : un 6 sur l'un est souvent rattrapé par une petite face sur un autre, ce qui resserre les sommes au centre."
    when_broken: "Si les dés tombent presque tous comme leur voisin, ils ne se compensent plus : la somme reste plate, comme pour un seul dé, et ajouter des dés n'y change presque rien."
    affects: [somme]
  de:
    type: choice
    healthy_value: "equilibre"
    label: "Dé équilibré"
    category: "loi"
    options:
      equilibre: { label: "Équilibré, chaque face une fois sur 6",
                   expr: "1 + (z > -0.9674) + (z > -0.4307) + (z > 0) + (z > 0.4307) + (z > 0.9674)" }
      pipe:      { label: "Pipé, le 6 sort une fois sur 3", robust_expected: true,
                   expr: "1 + (z > -1.1108) + (z > -0.6229) + (z > -0.2533) + (z > 0.0837) + (z > 0.4307)" }
    statement_tex: 'P(X_i = j) = 1/6'
    why: "On pense souvent que la cloche vient de dés parfaits. En réalité, il suffit que chaque dé ait une variance finie : c'est toujours le cas pour un dé."
    when_broken: "Avec un dé pipé, la cloche apparaît quand même : elle est seulement décalée vers les grandes sommes. Le théorème central limite ne demande pas des dés équilibrés."
    affects: [somme]

counterexamples:
  - id: "un-seul-de"
    label: "Un seul dé"
    explain: "Les six faces sont également probables : l'histogramme est plat, aucune cloche."
    state: { params: { k: 1 } }
  - id: "deux-des"
    label: "Deux dés"
    explain: "Le 7 est la somme la plus fréquente : l'histogramme forme un triangle, pas encore une cloche."
    state: { params: { k: 2 } }
  - id: "des-lies"
    label: "Dés liés"
    explain: "Les dés tombent presque tous comme leur voisin : la somme reste plate, même avec 10 dés."
    state: { hypotheses: { dependance: 0.9 } }

generator:
  type: random
  n: p.k                          # un lancer = k dés
  repeat: 1000                    # 1000 lancers
  variables:
    z: { expr: "ar1(normal(), h.dependance)" }   # dependance = 0 : les dés sont indépendants
    face: { expr: "@h.de" }       # face de 1 à 6 (seuils de la loi normale : 1/6 par face si équilibré)

methods:
  - id: somme
    role: method
    call: statistic
    label: "Somme des faces"
    args: { x: face, kind: "sum", continuity: true }

measures:
  aplatissement:
    agg: "kurtosis(reps.stat)"
    label: "Aplatissement (0 pour une cloche, -1,2 pour un histogramme plat)"
    decimals: 2
    primary: true
    target: 0
    direction: both
    ok_within: 0.40
    broken_beyond: 0.50
    texts:
      ok: "Forme en cloche : aplatissement de {value}."
      warning: "Presque une cloche : aplatissement de {value}."
      broken: "Pas encore une cloche : aplatissement de {value}."
  moyenne:
    agg: "mean(reps.stat)"
    label: "Somme moyenne (théorie : 3,5 k)"
    decimals: 1
  ecart_type:
    agg: "sd(reps.stat)"
    label: "Écart type de la somme"
    decimals: 2

challenges:
  - id: "peu-de-des"
    goal: "Trouvez le plus petit nombre de dés qui donne déjà une cloche (verdict Fiable)."
    when: "p.k <= 5 and s.aplatissement == 'ok'"
    unlock: "La cloche apparaît très vite : quelques dés suffisent, bien avant 30."
  - id: "de-pipe"
    goal: "Obtenez une cloche (verdict Fiable) avec un dé pipé."
    when: "h.de == 'pipe' and s.aplatissement == 'ok'"
    unlock: "Le théorème central limite ne demande pas des dés équilibrés : la cloche est seulement décalée."

auto_sweep: [p.k]

views:
  - id: sommes
    type: distribution
    title: "1000 lancers : la somme des dés"
    bind: { stat: reps.stat }
    ui: { x_title: "Somme des faces", labels: { stat: "Sommes obtenues" } }
  - id: sens-k
    type: sensitivity
    title: "Selon le nombre de dés"
    sweep: { axes: [p.k] }
  - id: sens-dependance
    type: sensitivity
    title: "Selon le lien entre les dés"
    sweep: { axes: [h.dependance] }

questions:
  - id: "des-q1-cloche"
    type: misconception
    prompt: "Vous lancez {k} dés équilibrés et vous additionnez les faces, 1000 fois. À quoi ressemble l'histogramme des sommes ?"
    hypothesis: "dependance"
    procedural_params:
      k: { min: 10, max: 30, step: 5 }
    choices:
      - id: "a"
        label: "Il reste plat, comme pour un seul dé."
        correct: false
        reveal_state: { params: { k: "{k}" } }
        verify: "s.aplatissement == 'ok'"
        focus_view: "sommes"
        explain: "Regardez l'histogramme : les sommes du milieu sont bien plus fréquentes que les extrêmes."
      - id: "b"
        label: "Il forme une cloche, centrée sur 3,5 fois le nombre de dés."
        correct: true
        reveal_state: { params: { k: "{k}" } }
        verify: "s.aplatissement == 'ok'"
        focus_view: "sommes"
        explain: "Exact : les dés indépendants se compensent, et la somme se resserre autour de sa moyenne."

  - id: "des-q2-pipe"
    type: misconception
    prompt: "Le dé est pipé : le 6 sort une fois sur trois. Avec {k} dés, la somme forme-t-elle encore une cloche ?"
    hypothesis: "de"
    procedural_params:
      k: { min: 15, max: 30, step: 5 }
    choices:
      - id: "a"
        label: "Non : il faut des dés équilibrés pour obtenir une cloche."
        correct: false
        reveal_state: { params: { k: "{k}" }, hypotheses: { de: "pipe" } }
        verify: "s.aplatissement == 'ok'"
        focus_view: "sommes"
        explain: "La cloche est bien là, seulement décalée vers les grandes sommes."
      - id: "b"
        label: "Oui : la cloche est seulement décalée vers les grandes sommes."
        correct: true
        reveal_state: { params: { k: "{k}" }, hypotheses: { de: "pipe" } }
        verify: "s.aplatissement == 'ok'"
        focus_view: "sommes"
        explain: "Exact : le théorème central limite demande des dés indépendants, pas des dés équilibrés."

  - id: "des-q3-lies"
    type: misconception
    prompt: "Les dés sont reliés par un fil : chacun tombe presque toujours comme son voisin. Avec {k} dés, obtient-on une cloche ?"
    hypothesis: "dependance"
    procedural_params:
      k: { min: 10, max: 15, step: 5 }
    choices:
      - id: "a"
        label: "Oui : avec assez de dés, on obtient toujours une cloche."
        correct: false
        reveal_state: { params: { k: "{k}" }, hypotheses: { dependance: 0.9 } }
        verify: "s.aplatissement == 'broken'"
        focus_view: "sommes"
        explain: "L'histogramme reste plat : des dés qui se copient ne se compensent plus."
      - id: "b"
        label: "Non : des dés qui se copient ne se compensent plus."
        correct: true
        reveal_state: { params: { k: "{k}" }, hypotheses: { dependance: 0.9 } }
        verify: "s.aplatissement == 'broken'"
        focus_view: "sommes"
        explain: "Exact : sans indépendance, ajouter des dés revient presque à multiplier un seul dé."
